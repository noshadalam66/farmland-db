services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: farmland
      POSTGRES_PASSWORD: farmland_local
      POSTGRES_DB: farmland
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U farmland -d farmland"]
      interval: 2s
      timeout: 3s
      retries: 15
